
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Print — Telier</title>
  <link rel="stylesheet" href="./css/style.css">
</head>

<body class="category-page">

  <header class="category-header">
    <a href="./index.html" class="category-back">← TELIER</a>
    <div class="category-header-right">BY ELISA DURÁN</div>
  </header>

  <main>
    <section class="category-hero">
      <div class="category-title">PRINT<span>.</span></div>
      <p>Diseño editorial, papelería y piezas gráficas que se pueden tocar.</p>
    </section>

    <section class="category-projects">

      <!-- PROYECTO 01: INVITACIONES DE BODA -->
      <article class="category-project" data-cursor="VIEW">
        <div class="category-project-number">01</div>

        <div class="category-project-image">
          <img
            src="boda.png"
            alt="Invitación de boda y papelería"
            class="category-project-media">
        </div>

        <div class="category-project-info">
          <div>
            <h2>Invitaciones de boda</h2>
            <span>PAPELERÍA / DISEÑO EDITORIAL</span>
          </div>
          <span class="project-arrow">↗</span>
        </div>
      </article>

      <!-- PROYECTO 02: MARCESH -->
      <article class="category-project project-offset" data-cursor="VIEW">
        <div class="category-project-number">02</div>

        <div class="category-project-image">
          <img
            src="marcesh.png"
            alt="Identidad visual y cartelería de Marcesh"
            class="category-project-media">
        </div>

        <div class="category-project-info">
          <div>
            <h2>Marcesh</h2>
            <span>EVENTO / DISEÑO GRÁFICO</span>
          </div>
          <span class="project-arrow">↗</span>
        </div>
      </article>

      <!-- PROYECTO 03: MARCESH RODEO -->
      <article class="category-project" data-cursor="VIEW">
        <div class="category-project-number">03</div>

        <div class="category-project-image">
          <img
            src="marceshrodeo.png"
            alt="Diseño gráfico y merchandising de Marcesh Rodeo"
            class="category-project-media">
        </div>

        <div class="category-project-info">
          <div>
            <h2>Marcesh Rodeo</h2>
            <span>EVENTO TEMÁTICO / MERCHANDISING</span>
          </div>
          <span class="project-arrow">↗</span>
        </div>
      </article>

    </section>
  </main>

  <script src="./js/script.js"></script>
</body>
</html>
